name: flutter_foreground_task
description: This plugin is used to implement a foreground service on the Android platform.
version: 8.17.0
homepage: https://github.com/Dev-hwang/flutter_foreground_task

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  shared_preferences: ^2.2.2
  platform: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

# PARVOZ VENDOR: pub.dev flutter_foreground_task 8.17.0 nusxasi (lib/, android/,
# ios/, LICENSE, README, CHANGELOG). Dart va iOS qismi o'zgarishsiz; Android
# Kotlin qismi yamalgan (doimiy WakeLock/WifiLock yo'q, FGS turi ish vaqtida,
# fon start yo'llari himoyalangan). Har bir yamoq: PARVOZ_PATCHES.md.
# Yangilashda: yangi versiyani shu tarzda qayta nusxalang va yamoqlarni qayta qo'llang.
flutter:
  plugin:
    platforms:
      android:
        package: com.pravera.flutter_foreground_task
        pluginClass: FlutterForegroundTaskPlugin
      ios:
        pluginClass: FlutterForegroundTaskPlugin
