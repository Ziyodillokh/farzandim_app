# JVM memory: jami 7.4GB RAM tizim. R8 minify (release) xotira talab qiladi,
# lekin 8G heap fizik RAM'dan katta bo'lib JVM crash berardi. 3G — R8 uchun
# yetarli va 7.4GB'da xavfsiz (OS ~2GB + kotlin daemon qoladi). CI'da ham yetarli.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Xss512k
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx768m
# Kotlin incremental o'chiq: pub kesh (D:) va loyiha (C:) turli disk-ildizlarida
# bo'lganda Kotlin'ning path converter'i "different roots" xatosi bilan yiqiladi.
kotlin.incremental=false
android.useAndroidX=true
# QR-skaner (mobile_scanner) ML Kit modelini APK ichiga QO'SHMAYDI — model
# Google Play Services'dan yuklanadi (unbundled).
#
# NEGA: bundled variant `libbarhopper_v3.so` ni APK'ga qo'shadi, u esa 4 KB
# sahifaga tekislangan. Google Play Android 15+ (targetSdk 35) uchun 16 KB
# sahifa qo'llab-quvvatlashini TALAB qiladi va AAB'ni rad etadi
# ("Ваше приложение не поддерживает страницы памяти размером 16 КБ").
# Unbundled variantda bu .so umuman bo'lmaydi -> talab bajariladi.
# Qo'shimcha foyda: APK hajmi ~2-3 MB kichrayadi.
#
# Ta'sir: QR orqali juftlashda model birinchi marta internetdan yuklanadi
# (bir martalik, bir necha soniya). Oila kodini QO'LDA kiritish esa
# internetsiz ham ishlayveradi — asosiy juftlash yo'li o'zgarmaydi.
dev.steenbakker.mobile_scanner.useUnbundled=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
