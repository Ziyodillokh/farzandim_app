<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farzandim — Kirish</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0A0A12;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1C1C24;
      border: 1px solid #2A2A35;
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: #C5F562;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 36px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #9999A8; margin-bottom: 28px; line-height: 1.5; }
    .tg-wrap { display: flex; justify-content: center; min-height: 48px; }
    .status {
      margin-top: 20px; padding: 12px 14px; border-radius: 12px;
      font-size: 13px; line-height: 1.4; display: none;
    }
    .status.show { display: block; }
    .status.info { background: rgba(96,165,250,0.12); color: #93C5FD; }
    .status.success { background: rgba(74,222,128,0.12); color: #6EE7A0; }
    .status.error { background: rgba(239,68,68,0.12); color: #FCA5A5; }
    .hint { margin-top: 24px; font-size: 12px; color: #6B6B78; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">&#128118;</div>
    <h1>Farzandim</h1>
    <p class="subtitle">Davom etish uchun Telegram orqali kiring</p>
    <div class="tg-wrap">
      <script async src="https://telegram.org/js/telegram-widget.js?22"
              data-telegram-login="farzandim_login_bot"
              data-size="large"
              data-onauth="onTelegramAuth(user)"
              data-request-access="write"></script>
    </div>
    <div id="status" class="status info"></div>
    <p class="hint">Ma'lumotlaringiz xavfsiz saqlanadi</p>
  </div>
  <script>
    function showStatus(type, text) {
      var el = document.getElementById('status');
      el.className = 'status show ' + type;
      el.textContent = text;
    }

    // Flutter WebView bridge — JavascriptChannel('FlutterAuth') orqali
    // muvaffaqiyatli/xato auth natijasi Flutter ilovasiga yetkaziladi.
    function postToFlutterAuth(data) {
      if (window.FlutterAuth && typeof window.FlutterAuth.postMessage === 'function') {
        try {
          window.FlutterAuth.postMessage(JSON.stringify(data));
        } catch (e) {
          console.warn('FlutterAuth postMessage failed:', e);
        }
      }
    }

    async function onTelegramAuth(user) {
      showStatus('info', 'Tekshirilmoqda...');
      try {
        const response = await fetch('/api/auth/telegram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(user)
        });
        const data = await response.json();
        if (response.ok) {
          showStatus('success', 'Muvaffaqiyatli! Ilovaga qaytmoqdamiz...');
          postToFlutterAuth({ ok: true, ...data });
        } else {
          showStatus('error', data.error || 'Kirishda xatolik');
          postToFlutterAuth({ ok: false, error: data.error || 'Auth failed', details: data });
        }
      } catch (err) {
        showStatus('error', 'Tarmoq xatosi. Internetni tekshiring.');
        postToFlutterAuth({ ok: false, error: 'Network error: ' + err.message });
      }
    }
  </script>
</body>
</html>
