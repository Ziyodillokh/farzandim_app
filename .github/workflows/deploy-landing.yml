name: Deploy Website → farzandimedu.uz

# ─────────────────────────────────────────────────────────────────────────────
# Asosiy sayt (Parvoz) — manba: website/public/ (statik, build kerak emas).
# 2026-10-04 dan sayt manbasi SHU REPODA: eski Lovable sayti (repoda yo'q edi)
# va eskirgan landingfarzandim/ o'rniga keldi.
#
#   test   → website/tests (havolalar, rasmlar, huquqiy sahifalar, nginx_switch)
#   deploy → website/deploy/make-stage.sh → serverga ~/parvoz-deploy →
#            sudo website/deploy/server-deploy.sh:
#              • /var/www/parvoz-releases/<vaqt>/ + /var/www/parvoz-site symlink
#              • nginx: farzandimedu.uz 443-blokida `location /` statik saytga
#                (faqat birinchi marta; konfig zaxirasi /var/backups/parvoz-nginx/)
#              • tekshiruv: har fayl xeshi + /api, /socket.io, /app, /child,
#                admin, /storage holati o'zgarmagan; xato bo'lsa — avtomatik
#                orqaga qaytarish (nginx konfig + symlink).
#
# Parvoz School demo paneli (school-panel/, Next.js statik eksport, basePath
# /school): school-panel job build qiladi (typecheck, lint, vitest, export
# tekshiruvi, Playwright), deploy job `out/` ni website/public/school/ ga
# qo'yadi — keyin odatdagi Stage/Publish (har fayl xeshi + avto-rollback).
#
# Parvoz Monitoring (monitoring-panel/, Next.js statik eksport, basePath
# /monitoring): viloyatlar kesimidagi yopiq tahlil paneli (demo ma'lumotlar).
# monitoring-panel job build va testlarni bajaradi, deploy job `out/` ni
# website/public/monitoring/ ga qo'yadi.
#
# Secretlar (deploy-test.yml bilan BIR XIL):
#   SSH_HOST, SSH_USER, SSH_PASSWORD (SSH + sudo paroli)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'school-panel/**'
      - 'monitoring-panel/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false

env:
  DOMAIN: farzandimedu.uz
  SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sayt va deploy vositasi testlari
        run: python3 -m unittest discover -s website/tests -v

  school-panel:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: school-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: school-panel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:export
      - name: Playwright (5 rol × barcha sahifalar)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: school-panel-playwright
          path: school-panel/test-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: school-panel-out
          path: school-panel/out
          retention-days: 3
          if-no-files-found: error
      # Haqiqiy panel (http rejim, haqiqiy backend) → /maktab/. Demo (/school, mock)
      # va uning E2E'si yuqorida; demo artefakti allaqachon yuklangan.
      - name: Build real panel (http, basePath /maktab)
        env:
          NEXT_PUBLIC_DATA_SOURCE: http
          NEXT_PUBLIC_API_BASE: /api
          PANEL_BASE_PATH: /maktab
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          rm -rf .next out
          npm run build
          npm run check:export
          grep -q '/maktab/_next/' out/index.html || { echo "::error::basePath /maktab emas"; exit 1; }
          if grep -q '/school/_next/' out/index.html; then echo "::error::demo basePath aralashdi"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: school-panel-maktab-out
          path: school-panel/out
          retention-days: 3
          if-no-files-found: error

  monitoring-panel:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: monitoring-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monitoring-panel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run check:export
      - name: basePath tekshiruvi
        run: grep -q '/monitoring/_next/' out/index.html || { echo "::error::basePath /monitoring emas"; exit 1; }
      - name: Playwright (rollar × barcha sahifalar, xarita, taqdimot, eksport)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: monitoring-panel-playwright
          path: monitoring-panel/test-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-panel-out
          path: monitoring-panel/out
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: [test, school-panel, monitoring-panel]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
      TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4

      # apt ba'zan runner'da osilib qoladi — deploy-test.yml dagi kabi timeout + 3 urinish.
      - name: Install transfer tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3; do
            if timeout 120 sudo -E apt-get install -y --no-install-recommends sshpass rsync; then break; fi
            echo "::warning::apt install urinish $i yiqildi — update bilan qayta"
            timeout 180 sudo -E apt-get update -o Acquire::Retries=3 || true
            sleep 10
          done
          command -v sshpass && command -v rsync

      - uses: actions/download-artifact@v4
        with:
          name: school-panel-out
          path: website/public/school

      - uses: actions/download-artifact@v4
        with:
          name: school-panel-maktab-out
          path: website/public/maktab

      - uses: actions/download-artifact@v4
        with:
          name: monitoring-panel-out
          path: website/public/monitoring

      - name: Stage (sayt + xesh manifest + deploy skriptlari)
        run: bash website/deploy/make-stage.sh "$RUNNER_TEMP/stage"

      - name: Upload → ~/parvoz-deploy
        run: |
          sshpass -e ssh ${SSH_OPTS} "$TARGET" 'mkdir -p ~/parvoz-deploy'
          sshpass -e rsync -az --delete --timeout=60 -e "ssh ${SSH_OPTS}" "$RUNNER_TEMP/stage/" "$TARGET:parvoz-deploy/"

      # Parol sudo'ga stdin orqali beriladi (buyruq qatorida ko'rinmaydi).
      - name: Publish (sudo server-deploy.sh — tekshiruv va avto-rollback bilan)
        run: |
          sshpass -e ssh ${SSH_OPTS} "$TARGET" \
            'sudo -S -p "" bash ~/parvoz-deploy/server-deploy.sh ~/parvoz-deploy' <<< "$SSHPASS"

      - name: Verify (tashqaridan, HTTPS)
        run: |
          set -e
          check() {  # $1 yo'l, $2 kutilgan status, $3 (ixtiyoriy) javobda bo'lishi shart bo'lgan matn
            body="$(curl -sS --max-time 20 -w '\n%{http_code}' "https://${DOMAIN}$1")"
            code="${body##*$'\n'}"
            [ "$code" = "$2" ] || { echo "::error::$1 → $code (kutilgan $2)"; exit 1; }
            [ -z "${3:-}" ] || grep -qF "$3" <<< "$body" || { echo "::error::$1 javobida '$3' yo'q"; exit 1; }
            echo "✓ $1 → $code"
          }
          check /                          200 "<title>Parvoz: farzandingizga erkinlik"
          check /privacy.html              200 "Maxfiylik siyosati"
          check /oferta.html               200 "313 060 726"
          check /tolov-va-qaytarish.html   200 "pul qaytarish"
          check /account-deletion.html     200 "Akkauntni"
          check /privacy                   200 "Maxfiylik siyosati"
          check /robots.txt                200 "Sitemap:"
          check /parvoz-yoq-sahifa         404 "Bu sahifa topilmadi"
          check /school/                   200 "Parvoz School"
          check /school/login/             200 "Parvoz School"
          check /maktab/                   200 "Parvoz School"
          check /maktab/login/             200 "/maktab/_next/"
          check /monitoring/               200 "Parvoz Monitoring"
          check /monitoring/login/         200 "/monitoring/_next/"
          # Backend maktab moduli jonlimi (deploy-test.yml): 401 — jonli, 404 — backend hali eski.
          sr="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST "https://${DOMAIN}/api/school/auth/refresh" || true)"
          [ "$sr" = "401" ] && echo "✓ /api/school/auth/refresh → 401" || echo "::warning::/api/school/auth/refresh → $sr"
          # /api holatini server-deploy.sh o'zgarishdan oldingi bilan solishtirgan; bu yerda faqat ogohlantirish.
          api="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://${DOMAIN}/api" || true)"
          [ "$api" = "200" ] && echo "✓ /api → 200" || echo "::warning::/api → $api"
