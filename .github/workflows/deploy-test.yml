name: Deploy → farzandimedu.uz

# ─────────────────────────────────────────────────────────────────────────────
# Yangi platformani (NestJS backend + Next.js admin + Flutter web/APK) serverning
# "chetiga" (alohida papka/port/DB) deploy qiladi. Eski platformaga TEGMAYDI.
#
# Kerakli repo secretlari (Settings → Secrets and variables → Actions):
#   SSH_HOST              – server IP/host (masalan 95.182.118.39)
#   SSH_USER              – SSH foydalanuvchi (masalan farzandim)
#   SSH_PASSWORD          – SSH paroli — TO'G'RI kiritilishi shart!
#   FIREBASE_CONFIGS_B64  – base64( tar.gz ): firebase_options.dart + google-services.json (4 fayl)
#   MAPS_API_KEY          – (ixtiyoriy) Google Maps kaliti; bo'sh bo'lsa xarita ishlamaydi
#   ANDROID_SIGNING_B64   – base64( tar.gz ): release keystore + key.properties (parent+child).
#                           Doimiy imzo → APK telefon ustiga yangilanadi (debug imzo har safar o'zgaradi).
#
# Faqat YANGI folderlar deploy qilinadi: backend, admin-web, Farzandim, farzandim_child.
# Birinchi marta server "bootstrap" qilingan bo'lishi kerak (infra/bootstrap-test.sh).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'admin-web/**'
      - 'Farzandim/**'
      - 'farzandim_child/**'
      - '.github/workflows/deploy-test.yml'
  workflow_dispatch:
    inputs:
      component:
        description: 'Qaysi komponent deploy qilinsin'
        type: choice
        default: all
        options:
          - all
          - backend
          - admin-web
          - flutter
          - apk

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  # ASOSIY domen (production). Eski "test.*" bosqichi tugadi — yangi platforma
  # asosiy farzandimedu.uz'ga ko'chirildi. (REMOTE_BASE server papkasi o'zgarmaydi.)
  TEST_DOMAIN: farzandimedu.uz
  API_URL: https://farzandimedu.uz/api
  WS_URL: wss://farzandimedu.uz
  REMOTE_BASE: new-platform
  NODE_VERSION: '22'
  FLUTTER_VERSION: '3.44.0'
  # ServerAlive* — uzatish paytida server javob bermay qolsa scp ~60s'da uzadi
  # (aks holda keep-alive yo'qligi sabab scp soatlab osilib qolardi).
  SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4

jobs:
  # ── Qaysi folderlar o'zgarganini aniqlaymiz ──
  changes:
    runs-on: ubuntu-22.04
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      admin:   ${{ steps.f.outputs.admin }}
      flutter: ${{ steps.f.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
            admin:
              - 'admin-web/**'
            flutter:
              - 'Farzandim/**'
              - 'farzandim_child/**'

  # ─────────────────────────── SIFAT DARVOZASI (parent app) ───────────────────────────
  # Regressiya to'sig'i: parent analyze (info ham fail) + unit testlar.
  # Yiqilsa flutter/apk job'lar ISHGA TUSHMAYDI — buzuq build serverga chiqmaydi.
  parent-quality:
    needs: changes
    if: ${{ needs.changes.outputs.flutter == 'true' || github.event.inputs.component == 'flutter' || github.event.inputs.component == 'apk' || github.event.inputs.component == 'all' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore Firebase config
        env:
          FIREBASE_CONFIGS_B64: ${{ secrets.FIREBASE_CONFIGS_B64 }}
        run: echo "$FIREBASE_CONFIGS_B64" | base64 -d | tar xz

      # env.json gitignore'da (pubspec asset deb e'lon qilingan) — busiz
      # flutter test asset-bundle bosqichida yiqiladi. Build joblardagi
      # bilan bir xil shakl, faqat test uchun stub.
      - name: Create env.json (asset bundle uchun stub)
        run: |
          mkdir -p Farzandim/assets
          printf '{\n  "MAPS_API_KEY": "",\n  "API_BASE_URL": "https://%s",\n  "WS_BASE_URL": "wss://%s"\n}\n' \
            "$TEST_DOMAIN" "$TEST_DOMAIN" > Farzandim/assets/env.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter analyze (0 issue talab — info ham xato)
        working-directory: Farzandim
        run: |
          flutter pub get
          flutter analyze --fatal-infos

      - name: flutter test (unit testlar)
        working-directory: Farzandim
        run: flutter test

  # ─────────────────────────── BACKEND (NestJS) ───────────────────────────
  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event.inputs.component == 'backend' || github.event.inputs.component == 'all' }}
    runs-on: ubuntu-22.04
    env:
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build (npm ci + prisma generate + nest build)
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Install transfer tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Upload to server
        run: |
          sshpass -e rsync -az --delete --exclude '.env' --exclude '.git' --exclude 'config/app-versions.json' -e "ssh ${SSH_OPTS}" \
            backend/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_BASE}/backend/"

      - name: Migrate DB & restart service
        run: |
          sshpass -e ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -se <<'EOF'
          set -euo pipefail
          cd ~/new-platform/backend
          npx prisma migrate deploy
          npx prisma generate          # server muhiti uchun Prisma engine (runner enginesi yuklanmaydi)
          sudo /usr/bin/systemctl restart farzandim-v2-backend.service
          # Backend ishga tushishi (Prisma connect + ~30 modul + Fastify plugin,
          # ayniqsa migratsiyadan keyingi birinchi boot) 4s'dan ko'p olishi
          # mumkin. 60s gacha retry qilamiz — aks holda soxta "deploy failed".
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -m 5 http://127.0.0.1:3100/api -o /dev/null 2>/dev/null; then
              ok=1
              echo "backend OK (urinish $i)"
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "backend 60s ichida javob bermadi — service holati + loglar:"
            systemctl is-active farzandim-v2-backend.service || true
            sudo journalctl -u farzandim-v2-backend.service -n 60 --no-pager || true
            exit 1
          fi
          EOF

  # ─────────────────────────── ADMIN PANEL (Next.js) ───────────────────────────
  admin-web:
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' || github.event.inputs.component == 'admin-web' || github.event.inputs.component == 'all' }}
    runs-on: ubuntu-22.04
    env:
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Build (npm ci + next build)
        working-directory: admin-web
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ env.WS_URL }}
          NEXT_PUBLIC_APP_NAME: Farzandim
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run build

      - name: Install transfer tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Upload to server
        run: |
          sshpass -e rsync -az --delete --exclude '.env*' --exclude '.git' -e "ssh ${SSH_OPTS}" \
            admin-web/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_BASE}/admin-web/"

      - name: Restart pm2 app (v2-admin :3101)
        run: |
          sshpass -e ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -se <<'EOF'
          set -euo pipefail
          cd ~/new-platform/admin-web
          pm2 reload v2-admin --update-env || pm2 start ~/new-platform/ecosystem.config.js --only v2-admin
          pm2 save
          sleep 2
          # basePath=/admin → bosh sahifa endi /admin'da (root '/' 404 beradi).
          curl -fsS http://127.0.0.1:3101/admin -o /dev/null && echo "admin-web OK"
          EOF

  # ─────────────────────────── FLUTTER (parent + child → web) ───────────────────────────
  flutter:
    # parent-quality o'tmasa deploy YO'Q (sifat darvozasi).
    needs: [changes, parent-quality]
    if: ${{ needs.changes.outputs.flutter == 'true' || github.event.inputs.component == 'flutter' || github.event.inputs.component == 'all' }}
    runs-on: ubuntu-22.04
    env:
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore Firebase config
        env:
          FIREBASE_CONFIGS_B64: ${{ secrets.FIREBASE_CONFIGS_B64 }}
        run: echo "$FIREBASE_CONFIGS_B64" | base64 -d | tar xz

      - name: Create env.json
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          mkdir -p Farzandim/assets
          printf '{\n  "MAPS_API_KEY": "%s",\n  "API_BASE_URL": "https://%s",\n  "WS_BASE_URL": "wss://%s"\n}\n' \
            "$MAPS_API_KEY" "$TEST_DOMAIN" "$TEST_DOMAIN" > Farzandim/assets/env.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build parent web (/app/)
        working-directory: Farzandim
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          # Web'da xarita flutter_map (Mapbox emas), lekin Yandex qidiruv/geocoding
          # web'da ham ishlaydi — kalitni uzatamiz.
          YANDEX_MAPS_KEY: ${{ secrets.YANDEX_MAPS_KEY }}
        run: |
          flutter pub get
          flutter build web --release --base-href /app/ \
            --dart-define=API_BASE_URL=https://${TEST_DOMAIN} \
            --dart-define=WS_BASE_URL=wss://${TEST_DOMAIN} \
            --dart-define=YANDEX_MAPS_KEY=${YANDEX_MAPS_KEY}
          # Google Maps JS kalitini build chiqishiga inject (web'da xarita uchun).
          sed -i "s|__MAPS_API_KEY__|${MAPS_API_KEY}|g" build/web/index.html

      - name: Build child web (/child/)
        working-directory: farzandim_child
        continue-on-error: true
        run: |
          [ -f web/index.html ] || flutter create --platforms web .
          flutter pub get
          flutter build web --release --base-href /child/ \
            --dart-define=API_BASE_URL=https://${TEST_DOMAIN} \
            --dart-define=WS_BASE_URL=wss://${TEST_DOMAIN}

      - name: Install transfer tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Upload static builds (nginx beradi)
        run: |
          set +e   # xatoni qo'lda boshqaramiz (timeout + retry + partial)
          DEST="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_BASE}/flutter"
          # rsync --timeout=60 + --partial + 3 urinish: server vaqtincha javob
          # bermay qolsa (keep-alive uzilishi / tarmoq sakrashi) bitta urinishda
          # yiqilmaydi — APK upload qadamidagi bilan bir xil chidamlilik.
          upload() {
            src="$1"; dst="$2"
            for i in 1 2 3; do
              echo "→ rsync $dst (urinish $i)"
              sshpass -e rsync -az --delete --partial --timeout=60 \
                --exclude '*.apk' -e "ssh ${SSH_OPTS}" "$src" "$dst" && return 0
              echo "::warning::$dst urinish $i muvaffaqiyatsiz — 10s'dan keyin qayta"
              sleep 10
            done
            return 1
          }
          FAIL=0
          upload "Farzandim/build/web/" "${DEST}/parent/" \
            || { echo "::error::parent web upload muvaffaqiyatsiz (3 urinish)"; FAIL=1; }
          if [ -f farzandim_child/build/web/index.html ]; then
            upload "farzandim_child/build/web/" "${DEST}/child/" \
              || { echo "::error::child web upload muvaffaqiyatsiz (3 urinish)"; FAIL=1; }
          else
            echo "child web build yo'q — o'tkazib yuborildi"
          fi
          sshpass -e ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'chmod o+x ~ && chmod -R o+rX ~/new-platform/flutter'
          exit $FAIL

  # ─────────────────────────── APK (parent + child → release .apk) ───────────────────────────
  # --no-shrink: R8 minify o'chiq (CI'da R8 "Compilation failed" bermasin). Test uchun yetarli.
  apk:
    # parent-quality o'tmasa APK build YO'Q (sifat darvozasi).
    needs: [changes, parent-quality]
    if: ${{ needs.changes.outputs.flutter == 'true' || github.event.inputs.component == 'apk' || github.event.inputs.component == 'all' }}
    runs-on: ubuntu-22.04
    # Fix'dan keyingi 1-build cache'siz (deps qayta yuklanadi) — 45 daq marja.
    timeout-minutes: 45
    env:
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore Firebase config
        env:
          FIREBASE_CONFIGS_B64: ${{ secrets.FIREBASE_CONFIGS_B64 }}
        run: echo "$FIREBASE_CONFIGS_B64" | base64 -d | tar xz

      # Bola ilovasi paketi `com.farzandim.growth` ga o'zgardi (Play'da eski
      # paket band edi). Secret'dagi konfiguratsiya eski paketniki — build
      # yiqilmasligi va FCM ishlashi uchun repodagi yangisini ustiga qo'yamiz.
      # Ota-ona ilovasining konfiguratsiyasiga TEGILMAYDI.
      - name: Override child Firebase config (com.farzandim.growth)
        run: |
          cp config/firebase/child/google-services.child.json \
             farzandim_child/android/app/google-services.json
          cp config/firebase/child/firebase_options.child.dart \
             farzandim_child/lib/firebase_options.dart

      - name: Create env.json
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          mkdir -p Farzandim/assets
          printf '{\n  "MAPS_API_KEY": "%s",\n  "API_BASE_URL": "https://%s",\n  "WS_BASE_URL": "wss://%s"\n}\n' \
            "$MAPS_API_KEY" "$TEST_DOMAIN" "$TEST_DOMAIN" > Farzandim/assets/env.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Runner root FS (~14GB) tor — Android SDK + Flutter + Gradle keshi
      # sig'may, kesh ochishda (tar -xf) "No space left" bo'lib deploy to'xtardi.
      # Keraksiz preinstalled SDK'larni (.NET / Haskell / CodeQL / Boost /
      # GraalVM / PowerShell + docker образ) o'chirib ~15GB bo'shatamiz.
      - name: Bo'sh disk joyi ochish
        run: |
          echo "Oldin:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/graalvm /usr/local/share/powershell 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "Keyin:"; df -h / | tail -1

      # Gradle dependency keshi — Maven Central ba'zan runner'larga 403
      # (rate-limit) qaytaradi va build yiqiladi. Kesh bo'lsa artefaktlar
      # tarmoqdan qayta yuklanmaydi → 403'ga chidamli + build tezroq.
      # MUHIM: faqat 'modules-2' (yuklab olingan artefaktlar — 403 himoyasi shu)
      # + 'wrapper' keshlanadi, butun ~/.gradle/caches EMAS: u build-cache /
      # transforms bilan 3.4GB gacha shishib, kesh ochishda diskni to'ldirib
      # deployni to'xtatardi. Kalit 'v2' — eski 3.4GB keshni bekor qiladi.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-v2-${{ runner.os }}-${{ hashFiles('Farzandim/android/**/*.gradle*', 'farzandim_child/android/**/*.gradle*', '**/gradle-wrapper.properties', 'Farzandim/pubspec.lock', 'farzandim_child/pubspec.lock') }}
          restore-keys: |
            gradle-v2-${{ runner.os }}-

      # Runner'da 7GB RAM bor — Gradle/lint xotirasini oshiramiz (lokal 4GB sozlamasi kam edi).
      # Bu "LintClassLoaderBuildService failed to stop" (metaspace/heap OOM) xatosini hal qiladi.
      - name: Tune Gradle memory for CI
        run: |
          for gp in Farzandim/android/gradle.properties farzandim_child/android/gradle.properties; do
            [ -f "$gp" ] || continue
            sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Xss512k/' "$gp"
            sed -i 's/^kotlin\.daemon\.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx2g/' "$gp"
            grep -q '^org.gradle.jvmargs' "$gp" || echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' >> "$gp"
            echo "--- $gp ---"; grep -E 'jvmargs' "$gp"
          done

      # Doimiy release keystore (har build bir xil imzo → telefon ustiga yangilanadi)
      - name: Restore Android signing (release keystore)
        env:
          ANDROID_SIGNING_B64: ${{ secrets.ANDROID_SIGNING_B64 }}
        run: echo "$ANDROID_SIGNING_B64" | base64 -d | tar xz

      - name: Build parent APK
        working-directory: Farzandim
        env:
          # Gradle (build.gradle.kts) System.getenv("MAPS_API_KEY") orqali o'qiydi va
          # AndroidManifest'dagi ${MAPS_API_KEY} placeholder'iga yozadi. Busiz xarita
          # plitkalari chiqmaydi (bo'sh kalit → bo'm-bo'sh kulrang xarita).
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          # Mapbox: sk (native SDK yuklash — gradle.properties) + pk (runtime,
          # dart-define) + Yandex kalit (qidiruv/ko'cha, dart-define).
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          YANDEX_MAPS_KEY: ${{ secrets.YANDEX_MAPS_KEY }}
        run: |
          # Mapbox maven auth uchun downloads token'ni gradle.properties'ga yozamiz.
          mkdir -p ~/.gradle
          grep -q MAPBOX_DOWNLOADS_TOKEN ~/.gradle/gradle.properties 2>/dev/null || \
            echo "MAPBOX_DOWNLOADS_TOKEN=${MAPBOX_DOWNLOADS_TOKEN}" >> ~/.gradle/gradle.properties
          flutter pub get
          build() {
            flutter build apk --release --target-platform android-arm,android-arm64 \
              --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} \
              --dart-define=API_BASE_URL=https://${TEST_DOMAIN} \
              --dart-define=WS_BASE_URL=wss://${TEST_DOMAIN} \
              --dart-define=MAPBOX_PUBLIC_TOKEN=${MAPBOX_PUBLIC_TOKEN} \
              --dart-define=YANDEX_MAPS_KEY=${YANDEX_MAPS_KEY}
          }
          # Maven Central vaqtinchalik 403 (rate-limit) berishi mumkin —
          # 60s kutib bir marta qayta urinamiz.
          build || { echo "::warning::build yiqildi — 60s'dan keyin retry"; sleep 60; build; }

      - name: Build child APK
        working-directory: farzandim_child
        continue-on-error: true
        run: |
          flutter pub get
          build() {
            flutter build apk --release --no-shrink --target-platform android-arm,android-arm64 \
              --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} \
              --dart-define=API_BASE_URL=https://${TEST_DOMAIN} \
              --dart-define=WS_BASE_URL=wss://${TEST_DOMAIN}
          }
          build || { echo "::warning::build yiqildi — 60s'dan keyin retry"; sleep 60; build; }

      - name: Install transfer tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Upload APKs to server (/app/*.apk)
        run: |
          set +e   # xatoni qo'lda boshqaramiz (timeout + retry + resume)
          P="Farzandim/build/app/outputs/flutter-apk/app-release.apk"
          C="farzandim_child/build/app/outputs/flutter-apk/app-release.apk"
          DEST="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_BASE}/flutter/parent"
          # rsync --timeout=60: 60s ma'lumot kelmasa uzadi (scp osilib qolardi).
          # --partial: yarim fayl saqlanadi → retry 0 dan emas, davomidan.
          upload() {
            src="$1"; name="$2"
            for i in 1 2 3; do
              echo "→ upload $name (urinish $i)"
              sshpass -e rsync -az --partial --timeout=60 -e "ssh ${SSH_OPTS}" "$src" "${DEST}/${name}" && return 0
              echo "::warning::$name upload urinish $i muvaffaqiyatsiz — 10s'dan keyin qayta"
              sleep 10
            done
            return 1
          }
          FAIL=0
          upload "$P" "farzandim-parent.apk" || { echo "::error::parent APK upload muvaffaqiyatsiz (3 urinish)"; FAIL=1; }
          if [ -f "$C" ]; then
            upload "$C" "farzandim-child.apk" || { echo "::error::child APK upload muvaffaqiyatsiz (3 urinish)"; FAIL=1; }
          else
            echo "child APK build yo'q — o'tkazib yuborildi"
          fi
          sshpass -e ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'chmod o+x ~ && chmod -R o+rX ~/new-platform/flutter'
          exit $FAIL

      # Version manifest — ilova /api/app/version dan o'qiydi va "Yangilash" tugmasini ko'rsatadi.
      # latest = build versiyasi (versionName), shu sabab yangi build = yangilanish chiqadi.
      - name: Update version manifest (config/app-versions.json)
        run: |
          V="1.0.${{ github.run_number }}"
          # Child APK 'continue-on-error: true' bilan quriladi — yiqilsa job
          # davom etadi. SHU HOLATDA manifest child versiyasini OSHIRMAYMIZ:
          # aks holda ilova "yangilanish bor" deb ko'rsatadi, lekin URL'dagi APK
          # eski (oldingi muvaffaqiyatli build) bo'lib qoladi → foydalanuvchi
          # yangilashni bossa ham eski versiyada qotib qoladi (real bug edi).
          C="farzandim_child/build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$C" ]; then
            CHILD_V="$V"
          else
            sshpass -e scp ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_BASE}/backend/config/app-versions.json" current.json 2>/dev/null || echo '{}' > current.json
            CHILD_V=$(python3 -c "import json; d=json.load(open('current.json')); print(((d.get('child') or {}).get('android') or {}).get('latest','1.0.0'))" 2>/dev/null || echo "1.0.0")
            echo "::error::Child APK build YIQILDI — manifest child versiyasi '$CHILD_V'da saqlandi (yangi child APK yo'q). 'Build child APK' qadami logini tekshiring."
          fi
          # ⚠️ 2026-08-06: playStoreUrl SHART qo'shildi. Frontend (Farzandim +
          # farzandim_child app_update_provider.dart) Play DDA 4.5 fix'idan
          # beri targetUrl'ni FAQAT storeUrl'dan oladi, directApkUrl'ga hech
          # qachon tushmaydi. Bu shablon avval faqat directApkUrl yozardi —
          # natijada "Yangilash" tugmasi bossa hech narsa ochilmasdi (targetUrl
          # null edi), chunki har APK build shu faylni serverda QAYTA YOZIB,
          # qo'lda qo'shilgan playStoreUrl'ni ham yo'qotardi. Play'da ilova
          # hali chop etilmagan bo'lsa ham URL to'g'ri turadi — tasdiqlangan
          # zahoti avtomatik ishlay boshlaydi, qayta deploy shart emas.
          cat > app-versions.json <<EOF
          {
            "parent": {
              "android": { "latest": "$V", "minSupported": "1.0.0", "playStoreUrl": "https://play.google.com/store/apps/details?id=com.farzandim", "directApkUrl": "https://${TEST_DOMAIN}/app/farzandim-parent.apk" },
              "ios": { "latest": "1.0.0", "minSupported": "1.0.0" },
              "releaseNotes": "Yangi versiya $V",
              "isForceUpdate": false
            },
            "child": {
              "android": { "latest": "$CHILD_V", "minSupported": "1.0.0", "playStoreUrl": "https://play.google.com/store/apps/details?id=com.farzandim.growth", "directApkUrl": "https://${TEST_DOMAIN}/app/farzandim-child.apk" },
              "ios": { "latest": "1.0.0", "minSupported": "1.0.0" },
              "releaseNotes": "Yangi versiya $CHILD_V",
              "isForceUpdate": false
            }
          }
          EOF
          sshpass -e scp ${SSH_OPTS} app-versions.json "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_BASE}/backend/config/app-versions.json"
          echo "version manifest yangilandi: parent=$V child=$CHILD_V"
