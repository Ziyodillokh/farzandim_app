name: Deploy → farzandimedu.uz

# ─────────────────────────────────────────────────────────────────────────────
# Yangi platformani (NestJS backend + Next.js admin + Flutter web) serverning
# "chetiga" (alohida papka/port/DB) deploy qiladi. Eski platformaga TEGMAYDI.
#
# ⚠️ APK TARQATISH TO'XTATILDI (2026-08-26). Ilgari bu workflow har deploy'da
# parent+child release APK build qilib serverga (/app/*.apk) yuklardi. Ikkala
# ilova ham endi do'konda (Play + App Store) — saytdagi APK esa yangilanmas
# edi: uning versionCode'i deploy run raqami (500+) bo'lgani uchun Play'dagi
# build (versionCode 3 va 7) ustiga o'rnatilmaydi — Android pastga tushirishga
# ruxsat bermaydi. Ya'ni APK o'rnatgan odam boshi berk ko'chada qolardi.
# Yangilanish endi FAQAT do'kon orqali. Play AAB'lari alohida workflow'larda:
#   .github/workflows/build-parent-aab.yml
#   .github/workflows/build-child-aab.yml
#
# Kerakli repo secretlari (Settings → Secrets and variables → Actions):
#   SSH_HOST              – server IP/host (masalan 95.182.118.39)
#   SSH_USER              – SSH foydalanuvchi (masalan farzandim)
#   SSH_PASSWORD          – SSH paroli — TO'G'RI kiritilishi shart!
#   FIREBASE_CONFIGS_B64  – base64( tar.gz ): firebase_options.dart + google-services.json (4 fayl)
#   MAPS_API_KEY          – (ixtiyoriy) Google Maps kaliti; bo'sh bo'lsa xarita ishlamaydi
#   ANDROID_SIGNING_B64   – release keystore + key.properties. Bu workflow'da
#                           ENDI ISHLATILMAYDI (APK build olib tashlandi), lekin
#                           build-*-aab.yml uchun KERAK — o'chirmang.
#
# Faqat YANGI folderlar deploy qilinadi: backend, admin-web, Farzandim, farzandim_child.
# Birinchi marta server "bootstrap" qilingan bo'lishi kerak (infra/bootstrap-test.sh).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'admin-web/**'
      - 'Farzandim/**'
      - 'farzandim_child/**'
      - '.github/workflows/deploy-test.yml'
  workflow_dispatch:
    inputs:
      component:
        description: 'Qaysi komponent deploy qilinsin'
        type: choice
        default: all
        options:
          - all
          - backend
          - admin-web
          - flutter

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  # ASOSIY domen (production). Eski "test.*" bosqichi tugadi — yangi platforma
  # asosiy farzandimedu.uz'ga ko'chirildi. (REMOTE_BASE server papkasi o'zgarmaydi.)
  TEST_DOMAIN: farzandimedu.uz
  API_URL: https://farzandimedu.uz/api
  WS_URL: wss://farzandimedu.uz
  REMOTE_BASE: new-platform
  NODE_VERSION: '22'
  FLUTTER_VERSION: '3.44.0'
  # ServerAlive* — uzatish paytida server javob bermay qolsa scp ~60s'da uzadi
  # (aks holda keep-alive yo'qligi sabab scp soatlab osilib qolardi).
  SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4

jobs:
  # ── Qaysi folderlar o'zgarganini aniqlaymiz ──
  changes:
    runs-on: ubuntu-22.04
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      admin:   ${{ steps.f.outputs.admin }}
      flutter: ${{ steps.f.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
            admin:
              - 'admin-web/**'
            flutter:
              - 'Farzandim/**'
              - 'farzandim_child/**'

  # ─────────────────────────── SIFAT DARVOZASI (parent app) ───────────────────────────
  # Regressiya to'sig'i: parent analyze (info ham fail) + unit testlar.
  # Yiqilsa flutter job ISHGA TUSHMAYDI — buzuq build serverga chiqmaydi.
  parent-quality:
    needs: changes
    if: ${{ needs.changes.outputs.flutter == 'true' || github.event.inputs.component == 'flutter' || github.event.inputs.component == 'all' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore Firebase config
        env:
          FIREBASE_CONFIGS_B64: ${{ secrets.FIREBASE_CONFIGS_B64 }}
        run: echo "$FIREBASE_CONFIGS_B64" | base64 -d | tar xz

      # env.json gitignore'da (pubspec asset deb e'lon qilingan) — busiz
      # flutter test asset-bundle bosqichida yiqiladi. Build joblardagi
      # bilan bir xil shakl, faqat test uchun stub.
      - name: Create env.json (asset bundle uchun stub)
        run: |
          mkdir -p Farzandim/assets
          printf '{\n  "MAPS_API_KEY": "",\n  "API_BASE_URL": "https://%s",\n  "WS_BASE_URL": "wss://%s"\n}\n' \
            "$TEST_DOMAIN" "$TEST_DOMAIN" > Farzandim/assets/env.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter analyze (0 issue talab — info ham xato)
        working-directory: Farzandim
        run: |
          flutter pub get
          flutter analyze --fatal-infos

      - name: flutter test (unit testlar)
        working-directory: Farzandim
        run: flutter test

  # ─────────────────────────── SIFAT DARVOZASI (backend) ───────────────────────────
  # Unit + e2e (haqiqiy Postgres'da, barcha migratsiyalar bo'sh bazaga
  # qo'llanadi). Yiqilsa backend deploy ISHGA TUSHMAYDI.
  backend-quality:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event.inputs.component == 'backend' || github.event.inputs.component == 'all' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farzandim
          POSTGRES_PASSWORD: farzandim
          POSTGRES_DB: farzandim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farzandim -d farzandim_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgresql://farzandim:farzandim@localhost:5432/farzandim_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install + prisma generate + typecheck
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit -p tsconfig.json

      - name: Unit testlar
        working-directory: backend
        run: npx jest --ci

      - name: E2E testlar (Postgres)
        working-directory: backend
        run: npm run test:e2e -- --ci

  # ─────────────────────────── BACKEND (NestJS) ───────────────────────────
  backend:
    needs: [changes, backend-quality]
    if: ${{ needs.changes.outputs.backend == 'true' || github.event.inputs.component == 'backend' || github.event.inputs.component == 'all' }}
    runs-on: ubuntu-22.04
    # Osilib qolgan ish concurrency navbatini 6 soat (GitHub default) band
    # qilmasin — quyidagi apt/ssh qadamlar odatda 1-3 daqiqa.
    timeout-minutes: 30
    env:
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build (npm ci + prisma generate + nest build)
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      # apt ba'zan runner'da osilib qoladi (mirror javob bermaydi) — 2026-08-19
      # run #502: backend ishi shu qadamda ~4 soat qotib, boshqa ish 45 daq
      # timeout bilan bekor bo'ldi va concurrency navbati butunlay to'xtadi.
      # Shuning uchun: avval update'siz o'rnatish (image'da ro'yxat bor),
      # bo'lmasa update+install — har biri `timeout` bilan, 3 urinish.
      - name: Install transfer tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3; do
            if timeout 120 sudo -E apt-get install -y --no-install-recommends sshpass rsync; then break; fi
            echo "::warning::apt install urinish $i yiqildi — update bilan qayta"
            timeout 180 sudo -E apt-get update -o Acquire::Retries=3 || true
            sleep 10
          done
          command -v sshpass && command -v rsync

      # Migratsiyadan OLDIN bazaning zaxira nusxasi (serverda, backend/ dan
      # tashqarida — rsync --delete o'chirmasin). Oxirgi 5 tasi saqlanadi.
      # pg_dump bo'lmasa — ogohlantirish (deploy to'xtamaydi).
      - name: Pre-deploy DB backup (+ PostgreSQL versiya tekshiruvi)
        run: |
          sshpass -e ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -se <<'EOF'
          set -euo pipefail
          umask 077
          cd ~/new-platform
          url="$(sed -n 's/^[[:space:]]*DATABASE_URL[[:space:]]*=//p' backend/.env | tail -n1 | tr -d "\"' \r")"
          url="${url%%\?*}"   # prisma'ning ?schema=public — libpq bilmaydi
          if command -v psql >/dev/null 2>&1; then
            v="$(psql "$url" -tAc 'show server_version_num' | tr -d '[:space:]')"
            [ "${v:-0}" -ge 120000 ] || { echo "::error::PostgreSQL $v < 12 (enum ADD VALUE migratsiyasi)"; exit 1; }
            echo "PostgreSQL $v"
          else
            echo "::warning::psql yo'q — versiya tekshirilmadi"
          fi
          if command -v pg_dump >/dev/null 2>&1; then
            mkdir -p backups
            f="backups/pre-deploy-$(date +%Y%m%d-%H%M%S).dump"
            pg_dump --no-owner -Fc -f "$f" "$url"
            ls -1t backups/pre-deploy-*.dump | tail -n +6 | xargs -r rm -f
            echo "zaxira: ~/new-platform/$f ($(du -h "$f" | cut -f1)); bo'sh joy: $(df -h ~ | awk 'END{print $4}')"
          else
            echo "::warning::pg_dump yo'q — zaxira olinmadi"
          fi
          EOF

      # SCHOOL_DATA_KEY → server .env: faqat YO'Q bo'lsa qo'shiladi, mavjudi HECH QACHON
      # almashtirilmaydi (almashsa shifrlangan javoblar ochilmaydi). Noto'g'ri formatdagi
      # kalit env validatsiyasida BUTUN backendni yiqitadi — yuklashdan oldin tekshiriladi.
      - name: Provision SCHOOL_DATA_KEY (idempotent, never overwrites)
        env:
          SCHOOL_DATA_KEY: ${{ secrets.SCHOOL_DATA_KEY }}
        run: |
          set -euo pipefail
          KEY="$(printf '%s' "${SCHOOL_DATA_KEY:-}" | tr -d '[:space:]')"
          if [ -z "$KEY" ]; then
            echo "::warning::SCHOOL_DATA_KEY secret yo'q — Bola ovozi / psixologik testlar 503 beradi"; exit 0
          fi
          if ! [[ "$KEY" =~ ^[A-Za-z0-9+/]{43}=$ ]] || [ "$(printf '%s' "$KEY" | base64 -d | wc -c)" -ne 32 ]; then
            echo "::error::SCHOOL_DATA_KEY 32 bayt base64 emas (openssl rand -base64 32)"; exit 1
          fi
          IFS= read -r -d '' REMOTE <<'EOS' || true
          set -euo pipefail
          umask 077
          ENVF="$HOME/new-platform/backend/.env"
          SEC="$HOME/new-platform/secrets"
          [ -f "$ENVF" ] || { echo "::error::$ENVF topilmadi"; exit 1; }
          is_key() { [ "$(printf '%s' "$1" | base64 -d 2>/dev/null | wc -c)" -eq 32 ]; }
          cur="$(sed -n 's/^[[:space:]]*SCHOOL_DATA_KEY[[:space:]]*=//p' "$ENVF" | tail -n1 | tr -d "\"' \t\r")"
          if [ -n "$cur" ]; then
            is_key "$cur" || { echo "::error::serverdagi SCHOOL_DATA_KEY yaroqsiz — qo'lda hal qiling"; exit 1; }
            if [ "$cur" = "$NEW_KEY" ]; then echo "SCHOOL_DATA_KEY bor (secret bilan bir xil)"
            else echo "::warning::serverdagi SCHOOL_DATA_KEY secret'dan farq qiladi — serverdagisi QOLDIRILDI"; fi
            exit 0
          fi
          mkdir -p "$SEC"; chmod 700 "$SEC"
          ts="$(date +%Y%m%d-%H%M%S)"
          cp -p "$ENVF" "$SEC/backend.env.bak.$ts"
          printf '%s\n' "$NEW_KEY" > "$SEC/school_data_key"
          if grep -q '^[[:space:]]*SCHOOL_DATA_KEY[[:space:]]*=' "$ENVF"; then
            # Bo'sh "SCHOOL_DATA_KEY=" qatori bor — almashtiriladi, egasi / huquqi asl fayldan.
            tmp="$(mktemp "$SEC/.env.new.XXXXXX")"
            grep -v '^[[:space:]]*SCHOOL_DATA_KEY[[:space:]]*=' "$ENVF" > "$tmp" || true
            [ -z "$(tail -c1 "$tmp")" ] || echo >> "$tmp"
            printf 'SCHOOL_DATA_KEY=%s\n' "$NEW_KEY" >> "$tmp"
            chmod --reference="$ENVF" "$tmp" 2>/dev/null || chmod 600 "$tmp"
            mv -f "$tmp" "$ENVF"
          else
            # Oddiy holat: fayl joyida to'ldiriladi — egasi, huquqi va inode o'zgarmaydi.
            [ -z "$(tail -c1 "$ENVF")" ] || echo >> "$ENVF"
            printf 'SCHOOL_DATA_KEY=%s\n' "$NEW_KEY" >> "$ENVF"
          fi
          echo "SCHOOL_DATA_KEY qo'shildi (zaxira: $SEC/backend.env.bak.$ts)"
          EOS
          # Kalit stdin'ning 1-qatorida (buyruq qatorida / ps'da ko'rinmaydi), qolgani — skript.
          { printf '%s\n' "$KEY"; printf '%s\n' "$REMOTE"; } \
            | sshpass -e ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
                'IFS= read -r NEW_KEY && export NEW_KEY && exec bash -s'

      - name: Upload to server
        run: |
          sshpass -e rsync -az --delete --exclude '.env' --exclude '.git' -e "ssh ${SSH_OPTS}" \
            backend/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_BASE}/backend/"

      - name: Migrate DB & restart service
        run: |
          sshpass -e ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -se <<'EOF'
          set -euo pipefail
          cd ~/new-platform/backend
          npx prisma migrate deploy
          npx prisma generate          # server muhiti uchun Prisma engine (runner enginesi yuklanmaydi)
          sudo /usr/bin/systemctl restart farzandim-v2-backend.service
          # Backend ishga tushishi (Prisma connect + ~30 modul + Fastify plugin,
          # ayniqsa migratsiyadan keyingi birinchi boot) 4s'dan ko'p olishi
          # mumkin. 60s gacha retry qilamiz — aks holda soxta "deploy failed".
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -m 5 http://127.0.0.1:3100/api -o /dev/null 2>/dev/null; then
              ok=1
              echo "backend OK (urinish $i)"
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "backend 60s ichida javob bermadi — service holati + loglar:"
            systemctl is-active farzandim-v2-backend.service || true
            # Repo OMMAVIY — log hammaga ko'rinadi: email, telefon, token va IP yashiriladi.
            sudo journalctl -u farzandim-v2-backend.service -n 60 --no-pager 2>/dev/null \
              | sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+/<email>/g; s/\+?998[0-9 -]{9,12}/<phone>/g; s/eyJ[[:alnum:]_-]+\.[[:alnum:]_-]+\.[[:alnum:]_-]+/<jwt>/g; s/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g' || true
            exit 1
          fi
          EOF

  # ─────────────────────────── ADMIN PANEL (Next.js) ───────────────────────────
  admin-web:
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' || github.event.inputs.component == 'admin-web' || github.event.inputs.component == 'all' }}
    runs-on: ubuntu-22.04
    # Osilib qolgan ish concurrency navbatini 6 soat (GitHub default) band
    # qilmasin — quyidagi apt/ssh qadamlar odatda 1-3 daqiqa.
    timeout-minutes: 30
    env:
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Build (npm ci + next build)
        working-directory: admin-web
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ env.WS_URL }}
          NEXT_PUBLIC_APP_NAME: Farzandim
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run build

      # apt ba'zan runner'da osilib qoladi (mirror javob bermaydi) — 2026-08-19
      # run #502: backend ishi shu qadamda ~4 soat qotib, boshqa ish 45 daq
      # timeout bilan bekor bo'ldi va concurrency navbati butunlay to'xtadi.
      # Shuning uchun: avval update'siz o'rnatish (image'da ro'yxat bor),
      # bo'lmasa update+install — har biri `timeout` bilan, 3 urinish.
      - name: Install transfer tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3; do
            if timeout 120 sudo -E apt-get install -y --no-install-recommends sshpass rsync; then break; fi
            echo "::warning::apt install urinish $i yiqildi — update bilan qayta"
            timeout 180 sudo -E apt-get update -o Acquire::Retries=3 || true
            sleep 10
          done
          command -v sshpass && command -v rsync

      - name: Upload to server
        run: |
          sshpass -e rsync -az --delete --exclude '.env*' --exclude '.git' -e "ssh ${SSH_OPTS}" \
            admin-web/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_BASE}/admin-web/"

      - name: Restart pm2 app (v2-admin :3101)
        run: |
          sshpass -e ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -se <<'EOF'
          set -euo pipefail
          cd ~/new-platform/admin-web
          pm2 reload v2-admin --update-env || pm2 start ~/new-platform/ecosystem.config.js --only v2-admin
          pm2 save
          sleep 2
          # basePath=/kirolmaysan → bosh sahifa o'shanda (root '/' 404 beradi).
          curl -fsS http://127.0.0.1:3101/kirolmaysan -o /dev/null && echo "admin-web OK"
          EOF

  # ─────────────────────────── FLUTTER (parent + child → web) ───────────────────────────
  flutter:
    # parent-quality o'tmasa deploy YO'Q (sifat darvozasi).
    needs: [changes, parent-quality]
    if: ${{ needs.changes.outputs.flutter == 'true' || github.event.inputs.component == 'flutter' || github.event.inputs.component == 'all' }}
    runs-on: ubuntu-22.04
    # Osilib qolgan ish concurrency navbatini 6 soat (GitHub default) band
    # qilmasin — quyidagi apt/ssh qadamlar odatda 1-3 daqiqa.
    timeout-minutes: 30
    env:
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore Firebase config
        env:
          FIREBASE_CONFIGS_B64: ${{ secrets.FIREBASE_CONFIGS_B64 }}
        run: echo "$FIREBASE_CONFIGS_B64" | base64 -d | tar xz

      - name: Create env.json
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          mkdir -p Farzandim/assets
          printf '{\n  "MAPS_API_KEY": "%s",\n  "API_BASE_URL": "https://%s",\n  "WS_BASE_URL": "wss://%s"\n}\n' \
            "$MAPS_API_KEY" "$TEST_DOMAIN" "$TEST_DOMAIN" > Farzandim/assets/env.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build parent web (/app/)
        working-directory: Farzandim
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          # Web'da xarita flutter_map (Mapbox emas), lekin Yandex qidiruv/geocoding
          # web'da ham ishlaydi — kalitni uzatamiz.
          YANDEX_MAPS_KEY: ${{ secrets.YANDEX_MAPS_KEY }}
        run: |
          flutter pub get
          flutter build web --release --base-href /app/ \
            --dart-define=API_BASE_URL=https://${TEST_DOMAIN} \
            --dart-define=WS_BASE_URL=wss://${TEST_DOMAIN} \
            --dart-define=YANDEX_MAPS_KEY=${YANDEX_MAPS_KEY}
          # Google Maps JS kalitini build chiqishiga inject (web'da xarita uchun).
          sed -i "s|__MAPS_API_KEY__|${MAPS_API_KEY}|g" build/web/index.html

      - name: Build child web (/child/)
        working-directory: farzandim_child
        continue-on-error: true
        run: |
          [ -f web/index.html ] || flutter create --platforms web .
          flutter pub get
          flutter build web --release --base-href /child/ \
            --dart-define=API_BASE_URL=https://${TEST_DOMAIN} \
            --dart-define=WS_BASE_URL=wss://${TEST_DOMAIN}

      # apt ba'zan runner'da osilib qoladi (mirror javob bermaydi) — 2026-08-19
      # run #502: backend ishi shu qadamda ~4 soat qotib, boshqa ish 45 daq
      # timeout bilan bekor bo'ldi va concurrency navbati butunlay to'xtadi.
      # Shuning uchun: avval update'siz o'rnatish (image'da ro'yxat bor),
      # bo'lmasa update+install — har biri `timeout` bilan, 3 urinish.
      - name: Install transfer tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3; do
            if timeout 120 sudo -E apt-get install -y --no-install-recommends sshpass rsync; then break; fi
            echo "::warning::apt install urinish $i yiqildi — update bilan qayta"
            timeout 180 sudo -E apt-get update -o Acquire::Retries=3 || true
            sleep 10
          done
          command -v sshpass && command -v rsync

      - name: Upload static builds (nginx beradi)
        run: |
          set +e   # xatoni qo'lda boshqaramiz (timeout + retry + partial)
          DEST="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_BASE}/flutter"
          # rsync --timeout=60 + --partial + 3 urinish: server vaqtincha javob
          # bermay qolsa (keep-alive uzilishi / tarmoq sakrashi) bitta urinishda
          # yiqilmaydi.
          #
          # ⚠️ Ilgari bu yerda `--exclude '*.apk'` bor edi — u APK'lar SHU
          # papkada turgani uchun `--delete` ularni o'chirib yubormasin deb
          # qo'yilgandi. APK tarqatish to'xtatilgach exclude OLIB TASHLANDI:
          # endi `--delete` eski farzandim-{parent,child}.apk fayllarini
          # serverdan o'zi tozalaydi va /app/*.apk havolalari 404 beradi.
          # Maqsad — hech kim boshqa yangilanmaydigan APK o'rnatmasin.
          upload() {
            src="$1"; dst="$2"
            for i in 1 2 3; do
              echo "→ rsync $dst (urinish $i)"
              sshpass -e rsync -az --delete --partial --timeout=60 \
                -e "ssh ${SSH_OPTS}" "$src" "$dst" && return 0
              echo "::warning::$dst urinish $i muvaffaqiyatsiz — 10s'dan keyin qayta"
              sleep 10
            done
            return 1
          }
          FAIL=0
          upload "Farzandim/build/web/" "${DEST}/parent/" \
            || { echo "::error::parent web upload muvaffaqiyatsiz (3 urinish)"; FAIL=1; }
          if [ -f farzandim_child/build/web/index.html ]; then
            upload "farzandim_child/build/web/" "${DEST}/child/" \
              || { echo "::error::child web upload muvaffaqiyatsiz (3 urinish)"; FAIL=1; }
          else
            echo "child web build yo'q — o'tkazib yuborildi"
          fi
          sshpass -e ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'chmod o+x ~ && chmod -R o+rX ~/new-platform/flutter'
          exit $FAIL
