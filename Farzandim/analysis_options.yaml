# Dart analyzer sozlamalari. `flutter analyze` shu fayldan foydalanadi.
# Very Good Analysis — Very Good Ventures (Flutter agency) tomonidan
# tayyorlangan qat'iy lint qoidalari to'plami.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart" # generated kod (json_serializable)
    - "**/*.freezed.dart" # generated kod (freezed)
    - "lib/firebase_options.dart" # generated kod (flutterfire configure)

linter:
  rules:
    # Bu qoida pub.dev'ga nashr qilinadigan PACKAGE'lar uchun mo'ljallangan
    # (har bir public a'zoga /// doc talab qiladi). Ilova kodida bu shovqin
    # tug'diradi — biz o'rniga muhim qarorlarni "nega"-izohlar bilan
    # hujjatlash standartiga amal qilamiz. Bitta markaziy joyda o'chirilgan,
    # fayllar ichida tarqoq `ignore_for_file` ishlatilmaydi.
    public_member_api_docs: false
