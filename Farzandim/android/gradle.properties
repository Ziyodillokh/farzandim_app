# JVM memory: jami 7.4GB RAM tizim. R8 minify (release) xotira talab qiladi —
# 1.5GB heap "GC thrashing" bilan yiqilardi, shuning uchun 3GB. Bu 7.4GB'da
# xavfsiz (OS ~2GB + kotlin daemon 512m qoladi). CI runnerда ham yetarli.
# Avvalgi 8G+4G JVM crash bergan edi (heap > fizik RAM) — 3G o'sha chegaradan past.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Xss512k
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx768m
# Kotlin incremental compilation o'chiq: pub kesh (D:) va loyiha (C:) turli
# disk-ildizlarida bo'lganda Kotlin'ning RelocatableFileToPathConverter'i
# "different roots" xatosi bilan yiqiladi. Incremental'siz to'liq kompilyatsiya
# bu muammoni chetlab o'tadi (CI/Linux'da ta'sirsiz — clean build incremental
# ishlatmaydi).
kotlin.incremental=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
