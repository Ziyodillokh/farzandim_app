# JVM memory: 8GB tizim uchun moslashtirilgan (jami 7.4GB RAM).
# 2GB heap — Flutter+Firebase Android build uchun yetarli, RAM
# yetishmasligi kelib chiqmaydi. Avvalgi 8G+4G+512m sozlamasi
# JVM crash bergan edi (`hs_err_pid*.log`).
org.gradle.jvmargs=-Xmx1500m -XX:MaxMetaspaceSize=384m -Xss512k
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx768m
# Kotlin incremental compilation o'chiq: pub kesh (D:) va loyiha (C:) turli
# disk-ildizlarida bo'lganda Kotlin'ning RelocatableFileToPathConverter'i
# "different roots" xatosi bilan yiqiladi. Incremental'siz to'liq kompilyatsiya
# bu muammoni chetlab o'tadi (CI/Linux'da ta'sirsiz — clean build incremental
# ishlatmaydi).
kotlin.incremental=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
